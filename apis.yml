aid: corvus-insurance
name: Corvus Insurance
description: Corvus Insurance — now operating as Corvus by Travelers — is a cyber-insurance
  managing general agency and insurtech company that pairs property and casualty underwriting
  with security-focused data science. It offers Smart Cyber Insurance and Smart Tech Errors
  & Omissions coverage, a Cyber Risk Dashboard that continuously scans policyholders' external
  attack surface for vulnerabilities and delivers threat intelligence and remediation guidance,
  24/7 incident response and claims support, and broker tooling for collaborative quoting and
  renewal management. Founded in 2017 and backed by Insight Partners and Obvious Ventures, Corvus
  was acquired by Travelers in 2024 and now operates as a Travelers company. The public site
  exposes marketing, broker resources, and a broker portal, but no public developer API program.
